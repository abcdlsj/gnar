[package]
name = "gnar"
version = "1.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abcdlsj/gnar"
description = "Publish and inspect a local HTTP service"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
anstyle = "1.0.14"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
futures-util = "0.3"
governor = "0.10.4"
http-body-util = "0.1"
postcard = { version = "1.1", features = ["alloc"] }
rand = "0.9"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.47", features = ["io-std", "macros", "net", "rt-multi-thread"] }
